[project]
name = "ai-seaflow-ticket-system"
version = "0.1.0"
description = "AI-powered ticket management system for Seaflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.4.0",
    "fastapi>=0.162.7",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
